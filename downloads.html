<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ดาวน์โหลดเอกสาร</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><a href="index.html">อนุบาลชุมแสง</a><a href="index.html">หน้าแรก</a></div></header><main class="max-w-6xl mx-auto px-5 py-12"><h1 class="text-4xl font-bold">ดาวน์โหลดเอกสาร</h1><div id="files" class="mt-8 space-y-3">กำลังโหลด...</div></main><script src="assets/js/supabase.js"></script><script src="assets/js/app.js"></script><script>(async()=>{const root=document.querySelector('#files');const {data,error}=await schoolSupabase.from('downloads').select('id,title,description,file_url,file_type,file_size_label,created_at').eq('is_published',true).order('sort_order').order('created_at',{ascending:false});if(error){root.textContent='โหลดรายการเอกสารไม่สำเร็จ';return}root.innerHTML=(data||[]).map(f=>`<article class="glass rounded-2xl p-5 flex flex-wrap justify-between gap-4 items-center"><div><b>${schoolUI.escapeHTML(f.title)}</b><p class="text-sm opacity-70 mt-1">${schoolUI.escapeHTML(f.description||'')} · ${schoolUI.escapeHTML(f.file_type||'File')} · ${schoolUI.escapeHTML(f.file_size_label||'')}</p></div><a class="btn-gold rounded-xl px-5 py-3" href="${schoolUI.escapeHTML(f.file_url)}" target="_blank" rel="noopener">เปิด/ดาวน์โหลด ↗</a></article>`).join('')||'<p>ยังไม่มีเอกสารเผยแพร่</p>'})()</script></body></html>

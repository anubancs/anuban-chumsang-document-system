<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ติดต่อโรงเรียน</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><a href="index.html">อนุบาลชุมแสง</a><a href="index.html">หน้าแรก</a></div></header><main class="max-w-5xl mx-auto px-5 py-12"><h1 class="text-4xl font-bold">ติดต่อโรงเรียน</h1><div class="grid md:grid-cols-2 gap-8 mt-8"><form id="contact" class="glass rounded-2xl p-6 space-y-4"><input name="sender_name" required maxlength="120" placeholder="ชื่อผู้ติดต่อ" class="w-full rounded-xl p-3 text-black"><input name="sender_email" type="email" placeholder="อีเมล" class="w-full rounded-xl p-3 text-black"><input name="subject" placeholder="หัวข้อ" class="w-full rounded-xl p-3 text-black"><textarea name="message" required minlength="5" maxlength="5000" rows="6" placeholder="ข้อความ" class="w-full rounded-xl p-3 text-black"></textarea><button class="brand-gradient text-white rounded-xl p-3 w-full">ส่งข้อความ</button></form><div class="glass rounded-2xl p-6"><h2 class="font-bold text-xl">แผนที่โรงเรียน</h2><p class="text-sm opacity-70 mt-2">กรุณาตั้งค่าแผนที่ Google Maps Embed ของโรงเรียนก่อนเผยแพร่</p><iframe title="แผนที่โรงเรียน" class="w-full h-64 rounded-xl mt-5" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=Wat%20Thap%20Krith%20Klang%20School&output=embed"></iframe></div></div></main><script src="assets/js/supabase.js"></script><script src="assets/js/api.js"></script><script>document.querySelector('#contact').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;try{await schoolAPI.submitContact(e.currentTarget);await Swal.fire('ส่งข้อความแล้ว','โรงเรียนได้รับข้อความของท่านแล้ว','success');e.currentTarget.reset()}catch(err){Swal.fire('ส่งไม่สำเร็จ',err.message,'error')}finally{b.disabled=false}})</script></body></html>

<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ข้อมูลระดับชั้นและห้องเรียน</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><a href="index.html">อนุบาลชุมแสง</a><a href="index.html">หน้าแรก</a></div></header><main class="max-w-6xl mx-auto px-5 py-12"><h1 class="text-4xl font-bold">ข้อมูลระดับชั้นและห้องเรียน</h1><p class="opacity-70 mt-3">แสดงเฉพาะข้อมูลภาพรวม ไม่เปิดเผยรายชื่อนักเรียนหรือข้อมูลส่วนบุคคล</p><div id="rooms" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-8">กำลังโหลด...</div></main><script src="assets/js/supabase.js"></script><script src="assets/js/app.js"></script><script>(async()=>{const root=document.querySelector('#rooms');const {data,error}=await schoolSupabase.from('class_overview').select('academic_year,grade_label,room_label,student_count').eq('is_published',true).order('academic_year',{ascending:false}).order('grade_label');if(error){root.textContent='โหลดข้อมูลไม่สำเร็จ';return}root.innerHTML=(data||[]).map(r=>`<article class="glass rounded-2xl p-6"><p class="text-wine text-sm">ปีการศึกษา ${schoolUI.escapeHTML(r.academic_year)}</p><h2 class="font-bold text-2xl mt-2">${schoolUI.escapeHTML(r.grade_label)} · ห้อง ${schoolUI.escapeHTML(r.room_label)}</h2><p class="mt-4 text-sm opacity-70">จำนวนนักเรียนรวม</p><strong class="text-3xl">${schoolUI.escapeHTML(r.student_count)}</strong><span class="ml-2">คน</span></article>`).join('')||'<p>ยังไม่มีข้อมูลที่เผยแพร่</p>'})()</script></body></html>

<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><b>School CMS · Dashboard</b><button id="logout">ออกจากระบบ</button></div></header><main class="max-w-7xl mx-auto p-5 md:p-10"><div class="flex flex-wrap justify-between gap-3 items-center"><div><p class="text-wine font-semibold">CONTENT MANAGEMENT</p><h1 class="text-3xl font-bold">จัดการเว็บไซต์โรงเรียน</h1></div><a href="../index.html" class="text-wine underline">ดูหน้าเว็บไซต์ ↗</a></div><section class="grid md:grid-cols-3 gap-4 my-8"><div class="glass rounded-2xl p-5"><p class="opacity-60">ข่าวทั้งหมด</p><strong id="news-count" class="text-3xl">—</strong></div><div class="glass rounded-2xl p-5"><p class="opacity-60">บุคลากร</p><strong id="staff-count" class="text-3xl">—</strong></div><div class="glass rounded-2xl p-5"><p class="opacity-60">เอกสารดาวน์โหลด</p><strong id="file-count" class="text-3xl">—</strong></div></section><section class="glass rounded-2xl p-6 mb-8"><h2 class="text-xl font-bold mb-4">เพิ่มข่าวประชาสัมพันธ์</h2><form id="news-form" class="grid md:grid-cols-2 gap-3"><input class="border rounded-xl p-3 text-black" name="title" placeholder="หัวข้อข่าว" required><input class="border rounded-xl p-3 text-black" name="slug" placeholder="slug ภาษาอังกฤษ เช่น school-activity" required><input class="border rounded-xl p-3 text-black md:col-span-2" name="cover_image_url" type="url" placeholder="URL ภาพหน้าปก (Google Drive direct image URL)"><textarea class="border rounded-xl p-3 text-black md:col-span-2" name="excerpt" placeholder="คำโปรย"></textarea><textarea class="border rounded-xl p-3 text-black md:col-span-2" name="content" rows="6" placeholder="เนื้อหาข่าว" required></textarea><button class="brand-gradient text-white rounded-xl p-3 md:col-span-2">บันทึกเป็นฉบับร่าง</button></form></section><section class="glass rounded-2xl p-6"><h2 class="text-xl font-bold mb-4">เพิ่มบุคลากร</h2><form id="staff-form" class="grid md:grid-cols-2 gap-3"><input class="border rounded-xl p-3 text-black" name="full_name" placeholder="ชื่อ-นามสกุล" required><input class="border rounded-xl p-3 text-black" name="position" placeholder="ตำแหน่ง" required><input class="border rounded-xl p-3 text-black" name="department" placeholder="กลุ่มสาระ/กลุ่มงาน"><input class="border rounded-xl p-3 text-black" name="photo_url" type="url" placeholder="URL รูปภาพ"><input class="border rounded-xl p-3 text-black md:col-span-2" name="personal_website_url" type="url" placeholder="เว็บไซต์ส่วนตัว (https://...)"><textarea class="border rounded-xl p-3 text-black md:col-span-2" name="bio" placeholder="ประวัติย่อ"></textarea><button class="brand-gradient text-white rounded-xl p-3 md:col-span-2">เพิ่มบุคลากร</button></form></section><p id="status" class="text-sm opacity-60 mt-5"></p></main><script src="../assets/js/supabase.js"></script><script>
(async()=>{const db=schoolSupabase;const {data:{user},error}=await db.auth.getUser();if(error||!user){location.href='login.html';return}const {data:admin}=await db.from('admin_users').select('role').eq('user_id',user.id).maybeSingle();if(!admin){await db.auth.signOut();location.href='login.html';return}const count=async(t)=>{const r=await db.from(t).select('*',{count:'exact',head:true});if(r.error)throw r.error;return r.count??0};try{document.querySelector('#news-count').textContent=await count('news');document.querySelector('#staff-count').textContent=await count('personnel');document.querySelector('#file-count').textContent=await count('downloads')}catch(e){document.querySelector('#status').textContent='โหลดสถิติไม่สำเร็จ: '+e.message}
document.querySelector('#news-form').addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget));const {error}=await db.from('news').insert({...f,status:'draft',created_by:user.id,author_name:user.email});if(error)Swal.fire('ผิดพลาด',error.message,'error');else{Swal.fire('สำเร็จ','บันทึกข่าวฉบับร่างแล้ว','success');e.currentTarget.reset();document.querySelector('#news-count').textContent=await count('news')}});
document.querySelector('#staff-form').addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget));const {error}=await db.from('personnel').insert({...f,social_links:{},is_published:false});if(error)Swal.fire('ผิดพลาด',error.message,'error');else{Swal.fire('สำเร็จ','เพิ่มบุคลากรเป็นฉบับไม่เผยแพร่แล้ว','success');e.currentTarget.reset();document.querySelector('#staff-count').textContent=await count('personnel')}});
document.querySelector('#logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};
})();</script></body></html>

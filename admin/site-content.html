<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการข้อมูลเว็บไซต์โรงเรียน</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><b>จัดการข้อมูลเว็บไซต์</b><nav class="flex gap-4"><a href="dashboard.html">Dashboard</a><a href="../index.html">ดูเว็บไซต์</a><button id="logout">ออกจากระบบ</button></nav></div></header><main class="max-w-5xl mx-auto p-5 md:p-10"><h1 class="text-3xl font-bold">ข้อมูลโรงเรียนและบริการออนไลน์</h1><p class="opacity-70 mt-2">แก้ไขข้อมูลที่แสดงในหน้าเกี่ยวกับโรงเรียน หลักสูตร นักเรียน/ผู้ปกครอง ประกันคุณภาพ และช่องทางติดต่อ ข้อมูลจะเผยแพร่เมื่อกดบันทึก</p><div id="editor" class="space-y-6 mt-8"></div><p id="status" role="status" class="text-sm mt-5"></p></main><script src="../assets/js/supabase.js"></script><script>
(async()=>{const db=schoolSupabase,$=s=>document.querySelector(s);const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data:member,error}=await db.from('admin_users').select('role').eq('user_id',user.id).maybeSingle();if(error||!member){await db.auth.signOut();location.href='login.html';return}$('#logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};
const sections=[
{key:'school_profile',title:'เกี่ยวกับโรงเรียน',help:'ประวัติ วิสัยทัศน์ พันธกิจ ค่านิยม ผู้บริหาร และโครงสร้าง 4 ฝ่าย',fields:[['history','ประวัติโรงเรียน'],['vision','วิสัยทัศน์'],['mission','พันธกิจ'],['values','ค่านิยม'],['director_name','ชื่อผู้อำนวยการ'],['director_message','สารจากผู้อำนวยการ'],['director_photo_url','URL รูปผู้อำนวยการ'],['organization','โครงสร้างองค์กร/4 ฝ่าย (อธิบายเป็นข้อความ)']]},
{key:'school_statistics',title:'สถิติโรงเรียน',help:'ใส่เฉพาะตัวเลขที่ตรวจสอบแล้ว และระบุปีการศึกษากำกับ',fields:[['academic_year','ปีการศึกษา'],['students','จำนวนนักเรียน'],['teachers','จำนวนครูและบุคลากร'],['classrooms','จำนวนห้องเรียน'],['updated_label','หมายเหตุ/วันที่ปรับปรุง']]},
{key:'school_quick_links',title:'ลิงก์ทางลัดหน้าแรก',help:'กรอก 1 รายการต่อ 1 บรรทัด รูปแบบ: ชื่อ | คำอธิบาย | URL',list:true,columns:['label','description','url']},
{key:'academic_programs',title:'หลักสูตรและการศึกษา',help:'กรอก 1 รายการต่อ 1 บรรทัด รูปแบบ: ชื่อหลักสูตร/กลุ่มสาระ | รายละเอียด | URL เอกสาร (ถ้ามี)',list:true,columns:['title','description','url']},
{key:'student_services',title:'ข้อมูลนักเรียนและผู้ปกครอง',help:'กรอก 1 รายการต่อ 1 บรรทัด รูปแบบ: ชื่อบริการ | รายละเอียด | URL (ลิงก์รับสมัครต้องผ่านการตรวจ PDPA แล้ว)',list:true,columns:['title','description','url']},
{key:'quality_documents',title:'ประกันคุณภาพการศึกษา (ไม่รวม ITA/OIT)',help:'กรอก 1 รายการต่อ 1 บรรทัด รูปแบบ: ชื่อเอกสาร | ประเภท (SAR/แผน) | URL',list:true,columns:['title','type','url']},
{key:'contact_details',title:'ข้อมูลติดต่อโรงเรียน',help:'ข้อมูลที่จะแสดงในหน้า Contact',fields:[['address','ที่อยู่โรงเรียน'],['phone','หมายเลขโทรศัพท์'],['email','อีเมล'],['facebook_url','Facebook Page URL'],['line_url','LINE Official URL'],['office_hours','เวลาทำการ']]}
];
const editor=$('#editor');const loaded={};for(const s of sections){const {data}=await db.from('settings').select('value').eq('key',s.key).maybeSingle();loaded[s.key]=data?.value??(s.json?s.default:Object.fromEntries(s.fields.map(([k])=>[k,''])));const html=s.list?'<textarea data-list rows="8" placeholder="รายการแรก | รายละเอียด | https://...&#10;รายการที่สอง | รายละเอียด | https://..." class="w-full rounded-xl p-3 text-black">'+esc((Array.isArray(loaded[s.key])?loaded[s.key]:[]).map(x=>s.columns.map(k=>x[k]||'').join(' | ')).join('\n'))+'</textarea>':s.fields.map(([k,label])=>'<label class="block text-sm font-medium mt-3">'+label+'<textarea data-field="'+k+'" rows="'+(k.includes('message')||k==='history'||k==='mission'||k==='organization'?4:2)+'" class="w-full rounded-xl p-3 text-black mt-1">'+esc(loaded[s.key]?.[k]??'')+'</textarea></label>').join('');editor.insertAdjacentHTML('beforeend','<section class="glass rounded-2xl p-6"><h2 class="text-xl font-bold">'+s.title+'</h2><p class="text-sm opacity-70 mt-1">'+s.help+'</p><div class="mt-3">'+html+'</div><button data-save="'+s.key+'" class="brand-gradient text-white rounded-xl px-5 py-3 mt-4">บันทึก'+s.title+'</button><span data-status="'+s.key+'" class="text-sm ml-3"></span></section>')}
editor.addEventListener('click',async e=>{const b=e.target.closest('[data-save]');if(!b)return;const s=sections.find(x=>x.key===b.dataset.save);let value;if(s.list){value=b.parentElement.querySelector('[data-list]').value.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>Object.fromEntries(line.split('|').map(x=>x.trim()).concat(Array(s.columns.length).fill('')).slice(0,s.columns.length).map((v,i)=>[s.columns[i],v])));if(value.some(row=>row.url&&!String(row.url).startsWith('https://')))return Swal.fire('URL ไม่ถูกต้อง','URL ของลิงก์ต้องขึ้นต้นด้วย https://','warning')}else{value={};b.parentElement.querySelectorAll('[data-field]').forEach(el=>value[el.dataset.field]=el.value.trim())}b.disabled=true;try{const {error}=await db.from('settings').upsert({key:s.key,value,is_public:true},{onConflict:'key'});if(error)throw error;b.parentElement.querySelector('[data-status]').textContent='บันทึกแล้ว';}catch(err){Swal.fire('บันทึกไม่สำเร็จ',err.message,'error')}finally{b.disabled=false}});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
})();</script></body></html>

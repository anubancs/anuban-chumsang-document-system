<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ทำเนียบบุคลากร | โรงเรียนอนุบาลชุมแสง</title><meta name="description" content="ทำเนียบผู้บริหาร ครู และบุคลากร โรงเรียนอนุบาลชุมแสง"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="brand-gradient text-white"><nav class="max-w-7xl mx-auto px-5 py-4 flex justify-between"><a href="index.html" class="font-bold">อนุบาลชุมแสง</a><a href="index.html">หน้าแรก</a></nav></header><main class="max-w-7xl mx-auto px-5 py-14"><p class="text-wine font-semibold">OUR PEOPLE</p><h1 class="text-4xl font-bold mt-2">ทำเนียบบุคลากร</h1><p class="opacity-70 mt-3">ผู้บริหาร ครู และบุคลากรของโรงเรียน</p><div class="mt-8 flex gap-3"><input id="search" class="glass rounded-xl px-4 py-3 w-full max-w-md" placeholder="ค้นหาชื่อ ตำแหน่ง หรือกลุ่มงาน..."></div><div id="people" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-8"><div class="skeleton h-72 rounded-2xl"></div><div class="skeleton h-72 rounded-2xl"></div><div class="skeleton h-72 rounded-2xl"></div></div></main><script src="assets/js/supabase.js"></script><script src="assets/js/app.js"></script><script src="assets/js/api.js"></script><script>
(async()=>{const root=document.querySelector('#people');let all=[];const draw=()=>{const q=document.querySelector('#search').value.toLowerCase();const rows=all.filter(p=>[p.full_name,p.position,p.department].some(v=>(v||'').toLowerCase().includes(q)));root.innerHTML=rows.length?rows.map(p=>{const socials=p.social_links||{};const links=Object.entries(socials).filter(([k,v])=>typeof v==='string'&&/^https:\/\//i.test(v)).map(([k,v])=>`<a class="text-wine underline mr-3" target="_blank" rel="noopener" href="${schoolUI.escapeHTML(v)}">${schoolUI.escapeHTML(k)}</a>`).join('');const website=p.personal_website_url&&/^https:\/\//i.test(p.personal_website_url)?`<a class="inline-block mt-3 text-wine font-semibold" target="_blank" rel="noopener" href="${schoolUI.escapeHTML(p.personal_website_url)}">เว็บไซต์/ผลงานส่วนตัว ↗</a>`:'';return `<article class="glass card-hover rounded-2xl p-6"><img class="w-28 h-28 rounded-full object-cover mx-auto bg-stone-200" src="${schoolUI.escapeHTML(p.photo_url||'https://placehold.co/200x200/701d32/fff?text=Staff')}" alt=""><div class="text-center mt-4"><h2 class="font-bold text-xl"><a class="hover:underline" href="teacher-profile.html?id=${encodeURIComponent(p.id)}">${schoolUI.escapeHTML(p.full_name)}</a></h2><p class="text-wine mt-1">${schoolUI.escapeHTML(p.position)}</p><p class="text-sm opacity-65">${schoolUI.escapeHTML(p.department||'')}</p><p class="text-sm mt-3 opacity-75">${schoolUI.escapeHTML(p.bio||'')}</p><div class="mt-3">${links}</div>${website}</div></article>`}).join(''):'<p class="opacity-60">ไม่พบข้อมูลบุคลากร</p>'};try{all=await schoolAPI.personnel();draw();document.querySelector('#search').addEventListener('input',draw)}catch(e){root.innerHTML='<p>ไม่สามารถโหลดข้อมูลได้</p>';console.error(e)}})();
</script></body></html>

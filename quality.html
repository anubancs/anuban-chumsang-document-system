<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ประกันคุณภาพการศึกษา | โรงเรียนอนุบาลชุมแสง</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="brand-gradient text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><a href="index.html">อนุบาลชุมแสง</a><a href="index.html">หน้าแรก</a></div></header><main class="max-w-6xl mx-auto px-5 py-12"><p class="text-wine font-semibold">SCHOOL QUALITY</p><h1 class="text-4xl font-bold mt-2">ประกันคุณภาพการศึกษา</h1><p class="opacity-70 mt-3">รายงานผลการประเมินตนเอง แผนพัฒนาคุณภาพ และเอกสารเผยแพร่ของสถานศึกษา</p><div id="docs" class="space-y-4 mt-8"></div><p class="text-sm opacity-60 mt-8">หน้านี้แสดงเฉพาะเอกสารประกันคุณภาพการศึกษา ไม่รวมข้อมูล ITA/OIT</p></main><script src="assets/js/supabase.js"></script><script src="assets/js/app.js"></script><script>(async()=>{const {data,error}=await schoolSupabase.from('settings').select('value').eq('key','quality_documents').eq('is_public',true).maybeSingle();const rows=Array.isArray(data?.value)?data.value:[];document.querySelector('#docs').innerHTML=rows.map(x=>'<article class="glass rounded-2xl p-5 flex flex-wrap justify-between gap-3"><div><b>'+schoolUI.escapeHTML(x.title||'เอกสาร')+'</b><p class="text-sm opacity-70">'+schoolUI.escapeHTML(x.type||'เอกสารเผยแพร่')+'</p></div>'+(x.url&&/^https:\/\//.test(x.url)?'<a class="text-wine underline" target="_blank" rel="noopener" href="'+schoolUI.escapeHTML(x.url)+'">เปิดเอกสาร →</a>':'')+'</article>').join('')||'<p class="opacity-70">ยังไม่มีเอกสารเผยแพร่ กรุณาติดต่อผู้ดูแลเว็บไซต์</p>';if(error)document.querySelector('#docs').textContent='ไม่สามารถโหลดเอกสารได้'})()</script></body></html>
